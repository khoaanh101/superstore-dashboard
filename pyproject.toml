[project]
name = "superstore-dashboard"
version = "0.1.0"
description = "A WebApp dashboard for Sales Report"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]==0.139.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
