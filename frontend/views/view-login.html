<!-- ============ LOGIN VIEW ============ -->
<section id="view-login" class="view login-view">
  <div class="brand-panel">
    <h1>Superstore<br />Sales Dashboard</h1>
    <p>Revenue, Profit and Customer Class — Collected from Sales Data.</p>
  </div>

  <div class="form-panel">
    <form id="login-form">
      <h2>Log in</h2>
      <input type="email" id="login-email" placeholder="example@email.com" autocomplete="email" required />
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
      <p class="error" id="login-error" hidden></p>
      <button type="submit" id="login-submit">Log in</button>
      <p class="switch-link">Haven't created an account? <a href="#" id="show-register">Register</a></p>
    </form>
  </div>
</section>
